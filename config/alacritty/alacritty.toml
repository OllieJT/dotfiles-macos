import = ["/Users/olliejt/.dotfiles/Dracula/dracula-alacritty.toml"]
working_directory = "/Users/olliejt/Developer"

[window]
padding = { x = 12, y = 12 }
decorations = "full"
opacity = 0.75
blur = true
dynamic_title = true

[font]
normal = { family = "Fira Code", style = "Regular" }
bold = { family = "Fira Code", style = "Bold" }
size = 14.0

[cursor]
style = { shape = "Beam", blinking = "On" }


[[hints.enabled]]
regex = "(/Users/)[^:;\\s]+"
post_processing = false
persist = true
command = "code"
mouse.enabled = true
binding = { key = "U", mods = "Control|Shift" }

[[hints.enabled]]
command = "open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "U", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

