- clean: ["~"]
- defaults:
      shell:
          stdout: true
          stderr: true
      link:
          create: true
          relink: true
          force: true
- link:
      ~/.gitconfig:
      ~/.bashrc:
      ~/.zshrc:
      ~/.zshenv:
      ~/.zprofile:
      ~/.config/gh: config/gh
      ~/.config/git: config/git
      ~/.config/bat: config/bat
      ~/.config/iterm2-config: config/iterm2-config
      ~/.config/starship.toml: config/starship.toml
      ~/.node-version: node-version
      ~/.local/bin/svgo: scripts/svgo
      ~/.local/bin/worktree-env: scripts/worktree-env
      ~/.agents/skills/dotfiles: skills/dotfiles
      ~/.claude/skills/dotfiles: skills/dotfiles
      ~/.agents/skills/resync-dotfiles: skills/resync-dotfiles
      ~/.claude/skills/resync-dotfiles: skills/resync-dotfiles
- shell:
      - command: ./setup/homebrew.zsh
      - command: ./setup/dev-zsh.zsh
      - command: ./setup/sys-files.zsh
      - command: ./setup/dev-xcode.zsh
      - command: ./setup/dev-node.zsh
